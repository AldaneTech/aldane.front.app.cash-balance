<header>
  <nav class="w-full bg-brand-main" [attr.aria-label]="'Main navigation' | t">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-4">
        <!-- Left: Logo + links -->
        <div class="flex items-center gap-8">
          <!-- Logo -->
          <a class="flex items-center gap-2" routerLink="/dashboard">
            <img src="assets/logo-menu.webp" width="144" height="40" class="w-36" alt="Logo CashBal">

          </a>

          <div class="hidden md:flex items-center gap-2">
            <a *ngFor="let item of menuItems" [routerLink]="item.path"
               routerLinkActive="bg-white/15 text-white" [routerLinkActiveOptions]="{ exact: item.path !== '/wallets' }"
               ariaCurrentWhenActive="page"
               class="rounded-xl px-3 py-2 text-white/80 hover:text-white hover:bg-white/10 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
              {{ item.label | t }}
            </a>
          </div>
        </div>

        <!-- Account menu -->
        <div class="flex items-center gap-3">
          <!-- Avatar + chevron -->
          <div #profileMenu class="relative" (focusout)="closeOnFocusOut($event)">
          <button #profileTrigger type="button" [attr.aria-label]="user?.username ? ('Profile options for {name}' | t:{ name: user?.username }) : ('Opciones de perfil' | t)"
            aria-controls="profile-options" [attr.aria-expanded]="profileMenuOpen"
            (click)="profileMenuOpen = !profileMenuOpen"
            class="flex items-center gap-2 rounded-xl hover:bg-white/15 px-2 py-1.5 transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
            <span aria-hidden="true" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 text-xs font-semibold text-white ring-2 ring-white/25">
              <ng-container *ngIf="initials; else accountIcon">{{ initials }}</ng-container>
              <ng-template #accountIcon><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/></svg></ng-template>
            </span>
            <span class="hidden max-w-32 truncate text-sm font-medium text-white sm:block">{{ user?.username || ('Account' | t) }}</span>
            <svg aria-hidden="true" class="h-4 w-4 text-white/80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <div *ngIf="profileMenuOpen" id="profile-options" [attr.aria-label]="'Opciones de perfil' | t"
            class="absolute right-0 top-full z-50 mt-2 w-64 overflow-hidden rounded-xl border border-gray-100 bg-white py-1 shadow-lg">
            <div class="border-b border-gray-100 px-4 py-3" [attr.aria-busy]="profileLoading">
              <ng-container *ngIf="user">
                <p class="truncate text-sm font-semibold text-brand-secondary">{{ user.username }}</p>
                <p class="mt-1 truncate text-xs text-gray-500" [title]="user.email || ''">{{ user.email }}</p>
              </ng-container>
              <p *ngIf="profileLoading && !user" role="status" class="text-xs text-gray-500">{{ 'Loading account…' | t }}</p>
              <div *ngIf="profileError" role="alert" class="text-xs text-red-700">
                <p>{{ 'We could not load your account.' | t }}</p>
                <button type="button" (click)="loadProfile()" class="mt-2 text-brand-main underline">{{ 'Try again' | t }}</button>
              </div>
            </div>
            <a routerLink="/profile" (click)="profileMenuOpen = false"
              class="block px-4 py-3 text-sm text-brand-secondary hover:bg-gray-100 focus-visible:bg-gray-100 focus-visible:outline-none">{{ 'Editar perfil' | t }}</a>
            <button type="button" (click)="logout()"
              class="block w-full border-t border-gray-100 px-4 py-3 text-left text-sm text-red-600 hover:bg-red-50 focus-visible:bg-red-50 focus-visible:outline-none">{{ 'Cerrar sesión' | t }}</button>
          </div>
          </div>
          </div>
          </div>
    </div>
    <div class="flex gap-2 overflow-x-auto px-4 pb-3 md:hidden">
      <a *ngFor="let item of menuItems" [routerLink]="item.path"
         routerLinkActive="bg-white/15 text-white" [routerLinkActiveOptions]="{ exact: item.path !== '/wallets' }"
         ariaCurrentWhenActive="page"
         class="shrink-0 rounded-xl px-3 py-2 text-sm text-white/80 hover:text-white hover:bg-white/10 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        {{ item.label | t }}
      </a>
    </div>
  </nav>
</header>

<main class="min-h-[calc(100dvh-4rem)] bg-brand-background px-4 py-6 sm:px-6 lg:px-8">
  <router-outlet></router-outlet>
</main>
